# SPDX-License-Identifier: Apache-2.0

[package]
name = "astraval-proto"
description = "Perforce-compatible wire protocol for Astraval."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Publish metadata. Required for crates.io and enforced by the `clippy::cargo`
# lint group, which keeps every publishable crate self-describing.
readme = "../../README.md"
keywords = ["perforce", "protocol", "version-control", "p4", "wire-protocol"]
categories = ["network-programming", "encoding"]

# Inherit the workspace-wide lint policy (deny-warnings + the curated clippy
# set) defined in the root `Cargo.toml`.
[lints]
workspace = true

[dependencies]
# Only the lightweight `tracing` facade: this crate emits spans and events but
# never decides where they go. The `astraval` binary owns the subscriber.
tracing.workspace = true
