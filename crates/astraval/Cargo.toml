# SPDX-License-Identifier: Apache-2.0

[package]
name = "astraval"
description = "The Astraval command-line client, an open-source alternative to Perforce."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Publish metadata. Required for crates.io and enforced by the `clippy::cargo`
# lint group, which keeps every publishable crate self-describing.
readme = "../../README.md"
keywords = ["perforce", "version-control", "cli", "game-development", "p4"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "astraval"
path = "src/main.rs"

# Inherit the workspace-wide lint policy (deny-warnings + the curated clippy
# set) defined in the root `Cargo.toml`.
[lints]
workspace = true

[dependencies]
astraval-core.workspace = true
clap.workspace = true

# The binary owns tracing output: the `tracing` facade to emit its own events,
# and `tracing-subscriber` to install the one process-wide subscriber that
# routes every crate's events to stderr.
tracing.workspace = true
tracing-subscriber.workspace = true
